name: QA Scheduled Multi-Site

on:
  schedule:
    # Run every weekday at 6 AM UTC
    - cron: '0 6 * * 1-5'

  workflow_dispatch:
    inputs:
      parallelism:
        description: 'Number of parallel site tests'
        required: false
        default: '2'

jobs:
  multi-site-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run multi-site tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
          TEST_PINCODE: ${{ secrets.TEST_PINCODE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node run-test.js --multi --config=sites.json

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-site-reports-${{ github.run_number }}
          path: |
            reports/*.html
            reports/*.json
            reports/screenshots/
          retention-days: 30

      - name: Print history
        if: always()
        run: node run-test.js --history || true
