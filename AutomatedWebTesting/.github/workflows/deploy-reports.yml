name: Deploy Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["QA Full Suite", "QA Scheduled Multi-Site"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download latest report artifacts
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-reports/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy reports to deploy directory
        if: github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p reports/deploy/AutomatedWebTesting/reports
          cp -r downloaded-reports/*/reports/*.html reports/deploy/AutomatedWebTesting/reports/ 2>/dev/null || true
          cp -r downloaded-reports/*/reports/*.json reports/deploy/AutomatedWebTesting/reports/ 2>/dev/null || true
          cp -r downloaded-reports/*/reports/screenshots/ reports/deploy/AutomatedWebTesting/reports/screenshots/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update index.html
        run: |
          cd reports/deploy/AutomatedWebTesting
          # Auto-generate index.html from available reports
          node -e "
          const fs = require('fs');
          const reports = fs.readdirSync('reports').filter(f => f.endsWith('.html')).sort().reverse();
          const rows = reports.map((f, i) => {
            const match = f.match(/full-report-(.+)\.html/);
            const site = match ? match[1] : f;
            return '<tr><td>#' + (reports.length - i) + '</td><td>' + site + '</td><td><a href=\"reports/' + f + '\">View Report</a></td></tr>';
          }).join('\n');
          const html = '<!DOCTYPE html><html><head><title>QA Reports</title><style>body{font-family:Arial;background:#1e1e2e;color:#e0e0e0;padding:40px}table{border-collapse:collapse;width:100%}th,td{padding:12px;border:1px solid #333;text-align:left}th{background:#2d2d3d}a{color:#4f46e5}</style></head><body><h1>QA Test Reports</h1><table><tr><th>#</th><th>Site</th><th>Report</th></tr>' + rows + '</table></body></html>';
          fs.writeFileSync('index.html', html);
          "

      - name: Commit and push
        run: |
          cd reports/deploy/AutomatedWebTesting
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "Auto-deploy reports from run #${{ github.run_number }}"
          git push || true
